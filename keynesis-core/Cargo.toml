[package]
name = "keynesis-core"
version = "1.2.0"
authors = ["Nicolas Di Prima <nicolas@primetype.co.uk>"]
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/primetype/keynesis"
documentation = "https://docs.rs/keynesis"
homepage = "https://github.com/primetype/keynesis"
categories = ["cryptography"]
keywords = ["crypto", "cryptoxide", "ed25519", "curve25519", "noise"]
description = "General purpose key management and associated cryptographic protocols"
exclude = [
    ".gitignore",
]

[features]
nightly = []

[dependencies]
packtool = { version = "0.3.0" }
cryptoxide = "0.5.1"
thiserror = "2.0.17"
hex = "0.4.3"
rand_core = "0.9.3"
rand_chacha = "0.9.0"
anyhow = "1.0.100"
eccoxide = { version = "0.3.1", default-features = false, features = ["p256r1"] }
base64 = "0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.5.1", features = [
    "OSX_10_12",
    "OSX_10_13",
    "OSX_10_14",
    "OSX_10_15",
] }
security-framework-sys = { version = "2.15.0" }
core-foundation = { version = "0.10.1", features = [] }

[dev-dependencies]
rand = "0.9.2"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
chrono = "0.4.42"

hacl-star = "0.1.0"
snow = { version = "0.10.0" }
noiseexplorer_ik = { path = "ref/IK.noise.rs" }
